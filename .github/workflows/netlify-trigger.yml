name: Netlify scrape trigger

on:
  schedule:
    - cron: '0 3 * * *'   # DAILY 03:00 UTC (round-11: daily cadence — site
                          # adds ~100 records/day; GitHub scheduler delays
                          # top-of-hour fires by minutes-to-hours, observed
                          # 03:00 -> 09:32 on 2026-09-28 — freshness window
                          # is 36h to absorb it) — fires the Netlify scrape
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: netlify-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check last scrape status (freshness + rc + drift), check build budget, then fire the Netlify hook
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VAULT0_SITE_ID: ${{ secrets.NETLIFY_VAULT0_SITE_ID }}
          SCRAPE_HOOK_URL: ${{ secrets.NETLIFY_SCRAPE_HOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_SITE_ID: 9f636436-d3c9-439b-976c-e9293e41ccd1
        run: |
          # V2-F2 fixes (verified broken by audit round-10): the inline
          # `python3 -c` block was unreachable (IndentationError + f-string
          # SyntaxError), `|| true` inside $() zeroed the rc, and a missing
          # blob defaulted healthy. Heredoc-file python, plain rc capture,
          # missing/unparsable => STALE (fail-loud).
          # ROUND-11: freshness 8d -> 36h (daily cadence); status line now
          # carries the drift verdict; a build-budget check joins in (legacy
          # free plan = 300 build-min/mo; ~7min/scrape + ~7.5min/weekly-media
          # ≈ 34 builds/mo nominal — warn >34, alert >40).
          cat > /tmp/check_status.py <<'PYEOF'
          import datetime, json, sys, urllib.request
          token, site = sys.argv[1], sys.argv[2]
          def get_blob(key):
              req = urllib.request.Request(
                  "https://api.netlify.com/api/v1/blobs/%s/site:ops/%s" % (site, key),
                  headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())
          media_rc = None
          media_line = "media: none yet"
          try:
              m = get_blob("status")
              media_rc = m.get("thumbs_rc")
              media_line = ("media: ts=%s thumbs_rc=%s blob=%s elapsed=%ss" % (
                  m.get("ts", ""), media_rc, m.get("blob"), m.get("elapsed_s")))
          except Exception as e:
              media_line = "media: unreadable (%s)" % str(e)[:60]
          try:
              d = get_blob("scrape-status")
              ts = d.get("ts", "")
              age_h = 999.0
              if ts:
                  t = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  age_h = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
              rc = d.get("rc", 99)
              # V4-P3-4: rc=3 + deferred=True (scrape-lock race with the GHA
              # catch-up) is a healthy defer, not a failure
              deferred = bool(d.get("deferred"))
              ok = age_h <= 36 and (rc in (0, 2) or (rc == 3 and deferred))
              drift = str(d.get("drift") or "")
              print("ts=%s age=%.1fh rc=%s partial=%s token_dead=%s chain=%s/%s drift=%s/%s | %s" % (
                  ts, age_h, rc, d.get("partial"), d.get("token_dead"),
                  d.get("chain_http"), d.get("chain_reason"),
                  d.get("drift"), d.get("drift_findings"), media_line))
              # R24 (2026-10-18): exit 4 = AIX token DEAD (rc=5 or token_dead=1,
              # blob fresh). Auth surfaces are silently dark (public data still
              # ships — the hook below still fires). Owner action required:
              # re-login on aix.studio, refresh AIX_TOKEN on 4 surfaces (ops
              # site env, runner secret, scripts/.aix_token, env-backup).
              # Stale wins over token-dead (age > 36h falls through to exit 1:
              # a dead-token pipeline that also went stale is a bigger outage
              # and the stale issue covers it).
              token_dead = bool(d.get("token_dead")) or rc == 5
              if token_dead and age_h <= 36:
                  sys.exit(4)
              # round-12: exit 2 = scrape healthy but the MEDIA build reported
              # a hard error (thumbs_rc 1 = error; 0/3 = complete/backlog-remains
              # are healthy). Monitors the previously-unread media status blob
              # (round-10 P2 residual).
              if ok and media_rc not in (None, 0, 3):
                  sys.exit(2)
              # V4-P2-1: the drift validator CRASHED (fail-open rc124/rc1
              # rides the status as drift="rcNNN") — all drift detection
              # incl. the lib-count guards is silently blind until someone
              # looks. Escalate to an issue (hook still fires).
              if ok and drift.startswith("rc"):
                  sys.exit(3)
              # R25 C6: EXPIRES-SOON — the ops scrape writes token_days_left
              # (mint epoch embedded in the token string + observed 30d TTL).
              # Warn BEFORE death (7d window — owner latency observed >5d).
              # Precedence: stale > dead > media > drift > SOON (active
              # failures outrank the pre-warning). Only when otherwise healthy
              # and not already dead. Robust to string-typed values.
              days_left = None
              try:
                  days_left = int(float(d.get("token_days_left")))
              except (TypeError, ValueError):
                  pass
              if (days_left is not None and 0 < days_left <= 7
                      and ok and not token_dead):
                  print("token expires in %dd (%s) — pre-expiry warning" % (
                      days_left, d.get("token_expires_at", "?")))
                  sys.exit(5)
              sys.exit(0 if ok else 1)
          except SystemExit:
              raise
          except Exception as e:
              print("unreadable: %s | %s" % (str(e)[:120], media_line))
              sys.exit(1)
          PYEOF
          # V5-P1 (2026-10-13): under bash -e a failing assignment
          # `DETAIL=$(python3 ...)` KILLS the step before CHECK_RC is
          # captured — observed live: the Oct 10 Netlify build failed at
          # its data-repo clone (expired PAT -> scrape-status rc=1), then
          # every later trigger died HERE in 0.6s with zero output: no
          # status echo, no stale-issue, NO HOOK POST — the designed
          # "page now, still fire — today's run may heal it" path was dead
          # code (same class as round-11 V1-P1-2). Shield the capture.
          set +e
          DETAIL=$(python3 /tmp/check_status.py "$NETLIFY_AUTH_TOKEN" "$VAULT0_SITE_ID" 2>&1)
          CHECK_RC=$?
          set -e
          echo "last scrape status: $DETAIL (check_rc=$CHECK_RC)"
          if [ "$CHECK_RC" = "2" ] || [ "$CHECK_RC" = "3" ] || [ "$CHECK_RC" = "4" ] || [ "$CHECK_RC" = "5" ]; then
            # scrape healthy but a subsystem is degraded (2 = media build
            # hard-error; 3 = drift validator crashed and is fail-open blind;
            # 4 = AIX token expired — auth surfaces dark, owner re-login
            # required; 5 = R25 pre-expiry warning — token dies within 7d,
            # owner re-login BEFORE the outage). Separate issue, hook still
            # fires (scrape is independent).
            if [ "$CHECK_RC" = "2" ]; then
              ISSUE_TITLE="Media build error (thumbs hard-fail)"
              ISSUE_BODY_PREAMBLE="The last media build reported a hard thumbs error (rc not 0/3). Check the Netlify builds list and the thumbs-push-lock state."
            elif [ "$CHECK_RC" = "4" ]; then
              ISSUE_TITLE="AIX token expired — auth scrape dead (owner re-login required)"
              ISSUE_BODY_PREAMBLE="The AIX site token died (scrape-status rc=5 / token_dead=1, fresh). Auth surfaces (canvas graphs, flow details, character/prop/scene libs) are NOT scraping; public surfaces continue. The token lives ~30 days server-side. OWNER ACTION: log into aix.studio in a browser, copy the fresh token, then update ALL FOUR surfaces: (1) Netlify aix-media-ops site env AIX_TOKEN (netlify CLI env:set), (2) this runner repo's Actions secret AIX_TOKEN, (3) scripts/.aix_token in the data repo working copy, (4) env-backup/aix_token + env-backup/secrets.env AIX_TOKEN in the data repo. After refresh, the next scrape auto-catches-up all missed auth data (id-dedup accumulate)."
            elif [ "$CHECK_RC" = "5" ]; then
              ISSUE_TITLE="AIX token expiring soon — re-login BEFORE it dies"
              ISSUE_BODY_PREAMBLE="The AIX site token expires within 7 days (mint epoch is embedded in the token; observed server TTL ~30d). Auth surfaces WILL go dark when it dies (public surfaces continue; recovery is automatic after refresh — id-dedup accumulate). OWNER ACTION (do it now, avoid the outage): log into aix.studio in a browser, copy the fresh token, then update ALL FOUR surfaces: (1) Netlify aix-media-ops site env AIX_TOKEN, (2) this runner repo's Actions secret AIX_TOKEN, (3) scripts/.aix_token in the data repo, (4) env-backup/aix_token + env-backup/secrets.env in the data repo."
            else
              ISSUE_TITLE="Drift validator crashed (fail-open blind)"
              ISSUE_BODY_PREAMBLE="The drift validator exited non-zero without a verdict (drift=rcNNN in the status). ALL drift detection incl. the auth-lib count guards is blind until fixed. Check schema_pins.json validity and the validator step logs in the last scrape build."
            fi
            # R24: dedup — a dead token persists for days until the owner
            # re-logs in; a plain create would spam one issue per trigger.
            # LIST open issues directly (search API is eventually-consistent)
            # and skip creation when an open one already carries this title.
            set +e
            OPEN_ISSUES=$(curl -s --max-time 20 \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/aixfeed/aix-studio-runner/issues?state=open&per_page=100")
            set -e
            ISSUE_DETAIL="$DETAIL" ISSUE_TITLE="$ISSUE_TITLE" ISSUE_BODY_PREAMBLE="$ISSUE_BODY_PREAMBLE" OPEN_ISSUES="$OPEN_ISSUES" python3 - <<'PYEOF'
          import json, os
          title = os.environ["ISSUE_TITLE"]
          try:
              existing = {i.get("title") for i in json.loads(os.environ["OPEN_ISSUES"] or "[]")
                          if isinstance(i, dict) and "pull_request" not in i}
          except Exception:
              existing = set()
          if title in existing:
              print("issue dedup: open issue '%s' already exists — skipping create" % title)
          else:
              body = {
                  "title": title,
                  "body": (os.environ["ISSUE_BODY_PREAMBLE"]
                           + "\n\nLast status: %s\n\nOpened by the daily "
                           "trigger check.") % os.environ["ISSUE_DETAIL"],
                  "labels": ["scrape-failure"],
              }
              open("/tmp/issue.json", "w").write(json.dumps(body))
          PYEOF
            if [ -f /tmp/issue.json ]; then
              curl -s --max-time 20 -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/aixfeed/aix-studio-runner/issues" \
                -d @/tmp/issue.json -o /tmp/issue-resp.json \
                -w "issue http=%{http_code}\n" || true
              rm -f /tmp/issue.json
            fi
          fi
          if [ "$CHECK_RC" != "0" ] && [ "$CHECK_RC" != "2" ] && [ "$CHECK_RC" != "3" ] && [ "$CHECK_RC" != "4" ] && [ "$CHECK_RC" != "5" ]; then
            # page now, still fire — today's run may heal it. V2-P3: the
            # detail goes in via env + json.dumps (no shell interpolation into
            # python source — blob content cannot break/inject the payload).
            # R25 C5: exact-title dedup (this channel opened daily duplicates
            # #18/#20/#22 while the validate gate was blocked).
            set +e
            OPEN_ISSUES2=$(curl -s --max-time 20 \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/aixfeed/aix-studio-runner/issues?state=open&per_page=100")
            set -e
            ISSUE_DETAIL="$DETAIL" OPEN_ISSUES="$OPEN_ISSUES2" python3 - <<'PYEOF'
          import json, os
          title = "Netlify scrape stale/failed"
          try:
              existing = {i.get("title") for i in json.loads(os.environ["OPEN_ISSUES"] or "[]")
                          if isinstance(i, dict) and "pull_request" not in i}
          except Exception:
              existing = set()
          if title in existing:
              print("issue dedup: open issue '%s' already exists — skipping create" % title)
          else:
              body = {
                  "title": title,
                  "body": ("The scrape-status blob is stale (>36h) or failed. "
                           "Last status: %s\n\nThe daily Netlify scrape did not "
                           "complete cleanly. Check https://app.netlify.com/sites/"
                           "aix-media-ops/builds (last scrape-mode build), the "
                           "build-minutes budget, and whether the trigger fired "
                           "the hook. This issue was opened by the daily 03:00 "
                           "UTC trigger check; the hook below was still fired so "
                           "today may self-heal.") % os.environ["ISSUE_DETAIL"],
                  "labels": ["scrape-failure"],
              }
              open("/tmp/issue.json", "w").write(json.dumps(body))
          PYEOF
            if [ -f /tmp/issue.json ]; then
              curl -s --max-time 20 -X POST \
                -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/aixfeed/aix-studio-runner/issues" \
                -d @/tmp/issue.json -o /tmp/issue-resp.json \
                -w "issue http=%{http_code}\n" || true
              rm -f /tmp/issue.json
            fi
          fi
          # --- build-budget guard (legacy free plan: 300 build-min/mo) ---
          # V4 round-12: the deploys API DOES expose durations (deploy_time
          # for ready builds; updated_at-created_at for errored ones —
          # validated ±2% against known elapsed_s), so this is now a true
          # MINUTES-SUM guard (was a build-count proxy; the "legacy plan
          # has no minutes API" conclusion was wrong). Nominal October
          # ~185 min (31 daily scrapes ~270s + 4 Monday media ~400s);
          # warn 200 / alert 250 leaves a month-end buffer.
          # V5-P1 sibling: shield the budget capture too (the python is
          # non-exiting by construction, but one unhandled edge kills the
          # step before the hook fires — defense in depth).
          set +e
          BUDGET=$(BUDGET_TOKEN="$NETLIFY_AUTH_TOKEN" BUDGET_SITE="$OPS_SITE_ID" python3 - <<'PYEOF'
          import datetime, json, os, urllib.request
          token, site = os.environ["BUDGET_TOKEN"], os.environ["BUDGET_SITE"]
          now = datetime.datetime.now(datetime.timezone.utc)
          month_start = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          n = minutes = 0
          page = 1
          try:
              while page <= 10:
                  req = urllib.request.Request(
                      "https://api.netlify.com/api/v1/sites/%s/deploys?per_page=100&page=%d" % (site, page),
                      headers={"Authorization": "Bearer " + token})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      deps = json.loads(r.read())
                  if not deps:
                      break
                  for b in deps:
                      t = datetime.datetime.fromisoformat(b["created_at"].replace("Z", "+00:00"))
                      if t < month_start:
                          continue
                      n += 1
                      d = 0.0
                      if b.get("deploy_time") is not None:
                          d = float(b["deploy_time"])
                      elif b.get("updated_at"):
                          try:
                              t2 = datetime.datetime.fromisoformat(b["updated_at"].replace("Z", "+00:00"))
                              d = max(0.0, (t2 - t).total_seconds())
                          except Exception:
                              pass
                      minutes += d / 60.0
                  page += 1
              print("builds_this_month=%d build_minutes=%.0f" % (n, minutes))
              if minutes > 250:
                  print("BUDGET_ALERT: %.0f build-min this month of the 300/mo "
                        "legacy plan — runaway/looping builds likely. Check "
                        "the builds list." % minutes)
              elif minutes > 200:
                  print("BUDGET_WARN: %.0f build-min this month (nominal "
                        "~185; alert 250)" % minutes)
          except Exception as e:
              print("budget check unreadable: %s" % str(e)[:80])
          PYEOF
          )
          set -e
          echo "$BUDGET"
          # --- fire the hook (title body REQUIRED: dispatch matches it) ---
          CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
            -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
            -d '{"title":"scrape"}' || echo 000)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 1 (http=$CODE)..."
            sleep 10
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 2 (http=$CODE)..."
            sleep 30
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          echo "hook POST http=$CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || { echo "::error::hook POST failed (http=$CODE)"; exit 1; }

      - name: Open issue on trigger failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Netlify trigger failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The daily trigger workflow failed — the Netlify scrape hook may not have fired. Run logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck: NETLIFY_SCRAPE_HOOK_URL secret (rotated?), NETLIFY_AUTH_TOKEN validity, the status-blob read.`,
              labels: ['scrape-failure']
            });

  heartbeat:
    # Keeps THIS repo's scheduled crons alive (60-day inactivity rule).
    needs: trigger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      issues: write
    steps:
      - name: Commit heartbeat via contents API (no checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$(printf '{"lastRun":"%s","workflow":"netlify-trigger","result":"%s"}' "$TS" "${{ needs.trigger.result }}")"
          CONTENT="$(printf '%s' "$PAYLOAD" | base64 -w0)"
          SHA="$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')"
          if [ -n "$SHA" ]; then
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s","sha":"%s"}' "$TS" "$CONTENT" "$SHA")"
          else
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s"}' "$TS" "$CONTENT")"
          fi
          HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            -d "$BODY")
          echo "heartbeat http: $HTTP"; head -c 200 /tmp/hb.json; echo
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]
