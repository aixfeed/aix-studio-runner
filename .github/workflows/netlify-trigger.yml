name: Netlify scrape trigger

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC — fires the Netlify scrape build
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: netlify-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check last scrape status (freshness + rc), then fire the Netlify hook
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VAULT0_SITE_ID: ${{ secrets.NETLIFY_VAULT0_SITE_ID }}
          SCRAPE_HOOK_URL: ${{ secrets.NETLIFY_SCRAPE_HOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          # --- 1. freshness + rc check on the LAST scrape-status blob -------
          # Review round-10: rc-only checks miss every silent failure (trigger
          # death, hook POST failure, title-less no-op, minutes exhaustion,
          # 15-min hard kill) — all leave the blob STALE-but-green. A blob
          # older than 8 days, a non-zero rc, or a missing blob = problem.
          STALE_OR_FAILED=0
          DETAIL="unreadable"
          STATUS_JSON=$(curl -s --max-time 30 \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/blobs/$VAULT0_SITE_ID/site:ops/scrape-status" || echo "")
          if [ -n "$STATUS_JSON" ] && echo "$STATUS_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            DETAIL=$(printf '%s' "$STATUS_JSON" | python3 -c '
              import json, sys, datetime
              d = json.load(sys.stdin)
              ts = d.get("ts", "")
              age_days = 99
              if ts:
                  t = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  age_days = (datetime.datetime.now(datetime.timezone.utc) - t).days
              rc = d.get("rc", 99)
              print(f"ts={ts} age={age_days}d rc={rc} partial={d.get(\"partial\")} chain_http={d.get(\"chain_http\")}")
              sys.exit(0 if (age_days <= 8 and rc in (0, 2)) else 1)
              ' || true)
            STALE_OR_FAILED=$?
            [ "$STALE_OR_FAILED" != "0" ] && STALE_OR_FAILED=1 || STALE_OR_FAILED=0
          fi
          echo "last scrape status: $DETAIL (stale_or_failed=$STALE_OR_FAILED)"
          if [ "$STALE_OR_FAILED" = "1" ]; then
            # page now, still fire — this week's run may heal it
            curl -s --max-time 20 -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/aixfeed/aix-studio-runner/issues" \
              -d "$(python3 -c "
              import json
              print(json.dumps({
                'title': 'Netlify scrape stale/failed (last: $DETAIL)',
                'body': 'The scrape-status blob is stale (>8d) or failed. The weekly Netlify scrape did not complete cleanly. Check: https://app.netlify.com/sites/aix-media-ops/builds (look for the last scrape-mode build), the build-minutes budget, and whether this trigger fired the hook. This issue was opened by the Monday 03:00 UTC trigger check; the hook below was still fired so this week may self-heal.',
                'labels': ['scrape-failure']}))")" \
              -o /tmp/issue.json -w "issue http=%{http_code}\n" || true
          fi
          # --- 2. fire the hook (title body REQUIRED: dispatch matches it) ---
          CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
            -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
            -d '{"title":"scrape"}' || echo 000)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 1 (http=$CODE)..."
            sleep 10
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 2 (http=$CODE)..."
            sleep 30
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          echo "hook POST http=$CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || { echo "::error::hook POST failed (http=$CODE)"; exit 1; }

      - name: Open issue on trigger failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Netlify trigger failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The Monday trigger workflow failed — the Netlify scrape hook may not have fired. Run logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck: NETLIFY_SCRAPE_HOOK_URL secret (rotated?), NETLIFY_AUTH_TOKEN validity, the status-blob read.`,
              labels: ['scrape-failure']
            });

  heartbeat:
    # Keeps THIS repo's scheduled crons alive (60-day inactivity rule).
    needs: trigger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      issues: write
    steps:
      - name: Commit heartbeat via contents API (no checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$(printf '{"lastRun":"%s","workflow":"netlify-trigger","result":"%s"}' "$TS" "${{ needs.trigger.result }}")"
          CONTENT="$(printf '%s' "$PAYLOAD" | base64 -w0)"
          SHA="$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')"
          if [ -n "$SHA" ]; then
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s","sha":"%s"}' "$TS" "$CONTENT" "$SHA")"
          else
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s"}' "$TS" "$CONTENT")"
          fi
          HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            -d "$BODY")
          echo "heartbeat http: $HTTP"; head -c 200 /tmp/hb.json; echo
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]
