name: Netlify scrape trigger

on:
  schedule:
    - cron: '0 3 * * 1'   # Monday 03:00 UTC — fires the Netlify scrape build
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: netlify-trigger
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check last scrape status (freshness + rc), then fire the Netlify hook
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          VAULT0_SITE_ID: ${{ secrets.NETLIFY_VAULT0_SITE_ID }}
          SCRAPE_HOOK_URL: ${{ secrets.NETLIFY_SCRAPE_HOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # V2-F2 fixes (verified broken by audit round-10): the inline
          # `python3 -c` block was unreachable (IndentationError + f-string
          # SyntaxError), `|| true` inside $() zeroed the rc, and a missing
          # blob defaulted healthy. Heredoc-file python, plain rc capture,
          # missing/unparsable => STALE (fail-loud).
          cat > /tmp/check_status.py <<'PYEOF'
          import datetime, json, sys, urllib.request
          token, site = sys.argv[1], sys.argv[2]
          try:
              req = urllib.request.Request(
                  "https://api.netlify.com/api/v1/blobs/%s/site:ops/scrape-status" % site,
                  headers={"Authorization": "Bearer " + token})
              with urllib.request.urlopen(req, timeout=30) as r:
                  d = json.loads(r.read())
              ts = d.get("ts", "")
              age_days = 99
              if ts:
                  t = datetime.datetime.fromisoformat(ts.replace("Z", "+00:00"))
                  age_days = (datetime.datetime.now(datetime.timezone.utc) - t).days
              rc = d.get("rc", 99)
              ok = age_days <= 8 and rc in (0, 2)
              print("ts=%s age=%dd rc=%s partial=%s chain_http=%s" % (
                  ts, age_days, rc, d.get("partial"), d.get("chain_http")))
              sys.exit(0 if ok else 1)
          except SystemExit:
              raise
          except Exception as e:
              print("unreadable: %s" % str(e)[:120])
              sys.exit(1)
          PYEOF
          DETAIL=$(python3 /tmp/check_status.py "$NETLIFY_AUTH_TOKEN" "$VAULT0_SITE_ID" 2>&1)
          CHECK_RC=$?
          echo "last scrape status: $DETAIL (check_rc=$CHECK_RC)"
          if [ "$CHECK_RC" != "0" ]; then
            # page now, still fire — this week's run may heal it. V2-P3: the
            # detail goes in via env + json.dumps (no shell interpolation into
            # python source — blob content cannot break/inject the payload).
            ISSUE_DETAIL="$DETAIL" python3 - <<'PYEOF'
          import json, os
          body = {
              "title": "Netlify scrape stale/failed",
              "body": ("The scrape-status blob is stale (>8d) or failed. "
                       "Last status: %s\n\nThe weekly Netlify scrape did not "
                       "complete cleanly. Check https://app.netlify.com/sites/"
                       "aix-media-ops/builds (last scrape-mode build), the "
                       "build-minutes budget, and whether the trigger fired "
                       "the hook. This issue was opened by the Monday 03:00 "
                       "UTC trigger check; the hook below was still fired so "
                       "this week may self-heal.") % os.environ["ISSUE_DETAIL"],
              "labels": ["scrape-failure"],
          }
          open("/tmp/issue.json", "w").write(json.dumps(body))
          PYEOF
            curl -s --max-time 20 -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/aixfeed/aix-studio-runner/issues" \
              -d @/tmp/issue.json -o /tmp/issue-resp.json \
              -w "issue http=%{http_code}\n" || true
          fi
          # --- fire the hook (title body REQUIRED: dispatch matches it) ---
          CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
            -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
            -d '{"title":"scrape"}' || echo 000)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 1 (http=$CODE)..."
            sleep 10
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "hook POST retry 2 (http=$CODE)..."
            sleep 30
            CODE=$(curl -s -o /tmp/hook.json -w "%{http_code}" --max-time 30 -X POST \
              -H "Content-Type: application/json" "$SCRAPE_HOOK_URL" \
              -d '{"title":"scrape"}' || echo 000)
          fi
          echo "hook POST http=$CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ] || { echo "::error::hook POST failed (http=$CODE)"; exit 1; }

      - name: Open issue on trigger failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Netlify trigger failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The Monday trigger workflow failed — the Netlify scrape hook may not have fired. Run logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCheck: NETLIFY_SCRAPE_HOOK_URL secret (rotated?), NETLIFY_AUTH_TOKEN validity, the status-blob read.`,
              labels: ['scrape-failure']
            });

  heartbeat:
    # Keeps THIS repo's scheduled crons alive (60-day inactivity rule).
    needs: trigger
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      issues: write
    steps:
      - name: Commit heartbeat via contents API (no checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$(printf '{"lastRun":"%s","workflow":"netlify-trigger","result":"%s"}' "$TS" "${{ needs.trigger.result }}")"
          CONTENT="$(printf '%s' "$PAYLOAD" | base64 -w0)"
          SHA="$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')"
          if [ -n "$SHA" ]; then
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s","sha":"%s"}' "$TS" "$CONTENT" "$SHA")"
          else
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s"}' "$TS" "$CONTENT")"
          fi
          HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            -d "$BODY")
          echo "heartbeat http: $HTTP"; head -c 200 /tmp/hb.json; echo
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]
