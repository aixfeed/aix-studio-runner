name: Weekly AIX Scrape

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC
  workflow_dispatch:       # manual trigger for verification

permissions:
  contents: read           # runner repo: code only, no push needed
  issues: write            # failure notifications

concurrency:
  group: weekly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout runner repo (pipeline code)
        uses: actions/checkout@v4

      - name: Clone data repo (data + resume state)
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/wesisad5/aix-studio-scraper.git" data
          echo "data repo HEAD: $(git -C data log --oneline -1)"

      - name: Sync pipeline code FROM data repo (data repo = source of truth)
        run: |
          # The data repo carries the authoritative pipeline code (developed
          # and tested locally, pushed with each fix). Syncing runner->data
          # caused the 2026-09-15 revert: a run dispatched before a script fix
          # reached this repo clobbered the fixed builders in the data repo.
          # Direction is now data->runner: the runner executes whatever main
          # has, and never writes scripts back into the data repo.
          # A6-P2-2: clean BEFORE copying — `cp -f` alone never deletes, so a
          # script removed/renamed in the data repo kept executing here
          # silently with stale semantics. Deletions must propagate.
          rm -f scripts/*.py run.sh
          cp -f data/scripts/*.py scripts/
          cp -f data/run.sh . 2>/dev/null || true
          # netlify-vault project (media blob sync build plugin) rides along
          rm -rf netlify-vault && mkdir -p netlify-vault
          cp -rf data/mini-services/netlify-vault/* netlify-vault/ 2>/dev/null || true
          echo "pipeline code synced from data repo @ $(git -C data rev-parse --short HEAD)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Write AIX auth token
        env:
          AIX_TOKEN: ${{ secrets.AIX_TOKEN }}
        run: |
          if [ -z "$AIX_TOKEN" ]; then
            echo "::warning::AIX_TOKEN secret not set — authed scrape will fail"
          fi
          printf '%s' "$AIX_TOKEN" > data/scripts/.aix_token

      - name: Transport smoke test (fail fast on WAF / site down)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_transport.py

      - name: Scrape public catalogs (gallery, flows, assets, ...)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_scraper.py

      - name: Auth scrape (canvas graphs + gated libraries)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_auth_scrape.py

      - name: Prism tag sweep (style_materials taxonomy)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_prism_tags.py

      - name: Lib detail sweep (character/prop/scene /detail enrichment)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_lib_details.py

      - name: Aux (comments + taxonomies)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_aux.py

      - name: Enrich (creator profiles)
        env:
          AIX_BASE: ${{ github.workspace }}/data
          AIX_TRANSPORT: playwright
        run: python3 scripts/aix_enrich.py

      - name: Finalize + rebuild catalogs
        env:
          AIX_BASE: ${{ github.workspace }}/data
        run: |
          python3 scripts/aix_finalize.py
          python3 scripts/aix_build_catalog.py
          python3 scripts/aix_build_catalog_auth.py
          python3 scripts/aix_media_manifest.py

      - name: Validate (pre-push data gate)
        env:
          AIX_BASE: ${{ github.workspace }}/data
        run: python3 scripts/aix_validate.py

      - name: Commit and push data repo
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_PAT }}
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes — data unchanged this run"
            exit 0
          fi
          TOTAL=$(python3 -c "import json;print(sum(json.load(open('src/data/catalog/index.json'))['counts'].values()))")
          GALLERY=$(python3 -c "import json;print(json.load(open('src/data/catalog/index.json'))['counts']['showcases'])")
          FLOWS=$(python3 -c "import json;print(json.load(open('src/data/catalog/index.json'))['counts']['workflows'])")
          git commit -m "weekly scrape $(date -u '+%Y-%m-%d %H:%M UTC'): ${TOTAL} records (gallery ${GALLERY}, workflows ${FLOWS})"
          # A6-P2-3: a push to the data repo during the 1-2h scrape window can
          # make this rebase conflict; the old `|| true` swallowed the
          # conflict, the push then failed non-fast-forward, and the ephemeral
          # runner was destroyed with the week's captured delta aboard. Fail
          # LOUDLY instead: abort the rebase and fail the run — the failure
          # issue opens, and next week's run re-captures everything (scrapes
          # are dedup/resumable, captures are idempotent).
          if ! git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/wesisad5/aix-studio-scraper.git" main; then
            echo "::error::data repo advanced mid-run — rebase conflict. Aborting rebase; the weekly delta is re-capturable next run (idempotent scripts, dedup'd scrapes)."
            git rebase --abort 2>/dev/null || true
            exit 1
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/wesisad5/aix-studio-scraper.git" main

      - name: Sync media thumbs to GH repo (Git data API, no checkout)
        env:
          GH_TOKEN: ${{ secrets.THUMBS_REPO_PAT }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # wesisad5/aix-media-thumbs — WebP thumb cache served from
          # raw.githubusercontent. Exit 3 = backlog remains (catch-up mode),
          # only exit 1 is a failure.
          # A6-P2-4: the Netlify ops executor (ops.sh) pushes to the SAME
          # Netlify thumbs store; concurrent index writes clobber (round-5
          # class). Take the thumbs-push-lock advisory lock (vault-0 `ops`
          # store); if the ops executor holds it, DEFER (success-with-notice
          # — backlog mode, no data loss).
          if [ -f scripts/blob_sync_lock.py ] && [ -n "${NETLIFY_AUTH_TOKEN:-}" ]; then
            VAULT0=$(python3 -c "import json; print(json.load(open('data/media_shards.json'))['shards'][0]['id'])")
            LOCK_SCRIPT="$(pwd)/scripts/blob_sync_lock.py"
            if python3 "$LOCK_SCRIPT" acquire --site "$VAULT0" --key thumbs-push-lock --holder gha-weekly --ttl 3600; then
              trap 'python3 "$LOCK_SCRIPT" release --site "$VAULT0" --key thumbs-push-lock --holder gha-weekly || true' EXIT
              echo "thumbs-push-lock acquired (holder gha-weekly)"
            else
              LRC=$?
              if [ "$LRC" = "3" ]; then
                echo "::notice::thumbs-push-lock held by the Netlify ops executor — deferring thumbs sync to it (backlog, no data loss)"
                exit 0
              fi
              echo "::warning::thumbs lock acquire rc=$LRC — proceeding without lock (best-effort advisory lock)"
            fi
          else
            echo "::warning::blob_sync_lock.py or NETLIFY_AUTH_TOKEN unavailable — thumbs sync proceeds without lock"
          fi
          # ROUND-9 CUTOVER: thumbs now land on the NETLIFY thumbs blob store
          # (aix-media-thumbs site) — the GH thumbs repo is FROZEN at the
          # pre-migration corpus and serves only as the route's fallback tier.
          # Same queue semantics, same 3-strike skips, same exit contract.
          # timeout guard: 124 (timeout) remapped to 3 = backlog remains.
          set +e
          timeout --signal=TERM --kill-after=30 2700 \
            env THUMBS_SITE_ID=75c01060-e863-4377-bbed-820ce64fafac \
            python3 scripts/aix_thumbs_push_netlify.py \
            --manifest data/download/aixstudio/media_manifest.json \
            --catalog data/src/data/catalog \
            --max-items 1500 --chunk 250 --fetch-workers 6
          rc=$?
          [ "$rc" = "124" ] && rc=3
          set -e
          echo "thumbs sync rc=$rc"
          # whitelist 0 (complete) / 3 (backlog remains); anything else
          # (1 error, 2 argparse, 137 kill) is a failure
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit 1

      - name: Sync full-res media to Netlify Blobs (sharded, direct SDK writes)
        # decoupled from thumbs success (runs 18/19 lesson: a thumbs failure
        # must not skip the blob chunk too — they are independent stores)
        if: ${{ !cancelled() }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN not set — skipping blob sync"
            exit 0
          fi
          # A6-P1-1: advisory lock on vault-0's `ops` store — the Netlify ops
          # executor (ops.sh) runs the SAME deterministic least-filled-shard
          # writer (aix_media_queue -> aix_blob_shards -> blob-sync.mjs); two
          # concurrent writers are blind to each other's done-set and clobber
          # the shard index last-writer-wins (round-5 class). Take the lock
          # BEFORE the plan (the chooser reads shard indexes); if the ops
          # executor holds it, skip with a notice (deferred — content-keyed
          # blobs make next week's catch-up idempotent, so no data loss and
          # the run stays green). Script rides in from the data repo via the
          # sync step; until it lands there, proceed unlocked with a warning.
          if [ ! -f scripts/blob_sync_lock.py ]; then
            echo "::warning::scripts/blob_sync_lock.py missing (data repo pre-fix) — proceeding without lock"
          else
            VAULT0=$(python3 -c "import json; print(json.load(open('data/media_shards.json'))['shards'][0]['id'])")
            LOCK_SCRIPT="$(pwd)/scripts/blob_sync_lock.py"
            if python3 "$LOCK_SCRIPT" acquire --site "$VAULT0" --key blob-sync-lock --holder gha-weekly; then
              trap 'python3 "$LOCK_SCRIPT" release --site "$VAULT0" --key blob-sync-lock --holder gha-weekly || true' EXIT
              echo "blob-sync-lock acquired (holder gha-weekly)"
            else
              LRC=$?
              if [ "$LRC" = "3" ]; then
                echo "::notice::blob-sync-lock held by the Netlify ops executor — skipping blob sync this run (deferred, no data loss)"
                exit 0
              fi
              echo "::warning::blob lock acquire rc=$LRC — proceeding without lock (best-effort advisory lock)"
            fi
          fi
          # images-first queue (videos excluded — the CDN has no working
          # low-res transcode; already-synced videos keep serving from
          # shard-0). P0 covers -> P1 gallery -> P2 canvas -> P3 audio ->
          # P4 avatars.
          python3 scripts/aix_media_queue.py \
            --manifest data/download/aixstudio/media_manifest.json \
            --catalog data/src/data/catalog \
            --out /tmp/media-queue-full.json
          # shard plan: fetch every shard's index, pick the least-filled
          # under target_bytes_per_shard (per-project-cap hedge; all shards
          # stay DRAFT — preview deploys only, never production)
          python3 scripts/aix_blob_shards.py \
            --registry data/media_shards.json \
            --out /tmp/shard-plan.json \
            --merged-out /tmp/blob-merged-index.json
          TARGET_SITE=$(python3 -c "import json; print(json.load(open('/tmp/shard-plan.json'))['target']['id'])")
          echo "upload target shard: $TARGET_SITE"
          # 2026-09-17: getStore({name, siteID, token}) performs WRITES with
          # a plain user PAT — no netlify deploy / build plugin needed
          # anymore. Works from any Node environment (this public runner has
          # free unlimited minutes; the sandbox and any machine are
          # fallbacks — the "leverage Netlify beyond GHA" hedge).
          # connectivity preflight: the CN CDN occasionally stalls runner
          # IPs (WAF); surface reachability in the log before the sync
          PROBE=$(python3 -c "import json; print(json.load(open('/tmp/media-queue-full.json'))[0]['url'])")
          curl -s -o /dev/null --max-time 30 -w "OSS probe: HTTP %{http_code} in %{time_total}s\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" -I "$PROBE" || true
          cd netlify-vault && npm install --no-audit --no-fund --silent
          set +e
          NETLIFY_AUTH_TOKEN="$NETLIFY_AUTH_TOKEN" TARGET_SITE_ID="$TARGET_SITE" \
          QUEUE_FILE=/tmp/media-queue-full.json MERGED_INDEX_FILE=/tmp/blob-merged-index.json \
          BLOB_CONCURRENCY=6 BLOB_MAX_MINUTES=25 BLOB_MAX_ITEM_BYTES=60000000 \
          BLOB_FETCH_TIMEOUT_MS=60000 \
          node blob-sync.mjs
          rc=$?
          set -e
          echo "blob sync rc=$rc"
          [ "$rc" = "0" ] || [ "$rc" = "3" ] || exit 1

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ github.run_id }}
          path: data/download/aixstudio/dataset_stats.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly AIX scrape failed (${new Date().toISOString().slice(0, 10)})`,
              body: `Automated scrape run failed.\n\nRun logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely causes: AIX_TOKEN expired (code 333), site redeploy/schema drift, or WAF blocking the runner IP.`,
              labels: ['scrape-failure']
            });

  heartbeat:
    # Keeps THIS repo's scheduled cron alive: GitHub auto-disables cron
    # workflows in repos with 60 days of no activity, and the runner repo
    # receives no other commits in steady state. One tiny commit per weekly
    # run makes the primary schedule self-sustaining. (The data-repo
    # "Weekly trigger (keepalive)" backup is belt-and-braces — it is
    # currently blocked by a private-repo Actions startup_failure, root
    # cause under investigation; see aix-studio-scraper worklog round-7.)
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A6-P3-2: a heartbeat failure must not silently kill the cron lifeline
    # (GitHub disables schedules after 60 days without a commit) — the issue
    # step below pages the same label as scrape failures. continue-on-error
    # keeps a heartbeat-only failure from reddening the whole run: by then
    # the scrape has already succeeded.
    continue-on-error: true
    permissions:
      contents: write
      issues: write
    steps:
      - name: Commit heartbeat via contents API (no checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PAYLOAD="$(printf '{"lastRun":"%s","runNumber":%s,"result":"%s"}' \
            "$TS" "${{ github.run_number }}" "${{ needs.scrape.result }}")"
          CONTENT="$(printf '%s' "$PAYLOAD" | base64 -w0)"
          SHA="$(curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))')"
          if [ -n "$SHA" ]; then
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s","sha":"%s"}' "$TS" "$CONTENT" "$SHA")"
          else
            BODY="$(printf '{"message":"heartbeat %s [skip ci]","content":"%s"}' "$TS" "$CONTENT")"
          fi
          HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
            -H "Authorization: token ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/aixfeed/aix-studio-runner/contents/.github/last-run.json" \
            -d "$BODY")
          echo "heartbeat http: $HTTP"; head -c 200 /tmp/hb.json; echo
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]

      - name: Open issue on heartbeat failure
        # A6-P3-2: mirrors the scrape job's failure-issue pattern — without
        # this, a heartbeat death (API change, permissions regression) was
        # invisible until GitHub silently disabled the cron 60 days later.
        if: failure()
        uses: actions/github-script@v7
        env:
          SCRAPE_RESULT: ${{ needs.scrape.result }}
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly heartbeat failed (${new Date().toISOString().slice(0, 10)})`,
              body: `The heartbeat commit (cron keepalive) failed — this repo's scheduled workflow is at risk: GitHub disables crons after 60 days without a commit.\n\nRun logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe scrape itself may have succeeded (result: ${process.env.SCRAPE_RESULT}); this failure is the cron lifeline only. Check the contents-API PUT (token scopes, .github/last-run.json).`,
              labels: ['scrape-failure']
            });
